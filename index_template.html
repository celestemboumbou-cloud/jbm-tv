<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>JBM tv</title>
<meta name="theme-color" content="#0e1120">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
%%HLS%%
<style>
:root{
  --bg:#0e1120; --panel:#151936; --btn:#2b3554; --row:#252a3f; --row2:#30364f;
  --text:#ffffff; --muted:#98a3cc; --orange:#ffab2e; --red:#b3191d; --accent:#0150fb; --line:rgba(255,255,255,.1);
  --font-display:'Sora','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#eaeefb; --panel:#ffffff; --btn:#d7def5; --row:#ffffff; --row2:#e3e9fb;
  --text:#0e1430; --muted:#55628f; --line:rgba(14,20,48,.14);
}
html{font-size:clamp(11px,3.3vh,28px);scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:600;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
[hidden]{display:none!important}
.ic{display:block;flex:none}
:focus{outline:none}
:focus-visible{outline:.2rem solid #fff;outline-offset:.12rem;box-shadow:0 0 0 .38rem var(--accent);z-index:3;position:relative}
.crow:focus-visible,.catrow:focus-visible,.orow:focus-visible{outline-offset:-.25rem;box-shadow:none}
.mut{color:var(--muted)}

#app{height:100vh;height:100dvh}
.scr{height:100%;display:flex;flex-direction:column;padding:0 4% 2.2%}

/* ---------- accueil ---------- */
.hd{display:flex;align-items:center;justify-content:space-between;padding:2.6% 0 1.4%;flex:none}
.hlogo{height:4.2rem;width:4.2rem;border-radius:1rem}
.hicons{display:flex;gap:.9rem}
.rb{width:3rem;height:3rem;border-radius:50%;background:var(--btn);display:grid;place-items:center;flex:none;color:#fff}
[data-theme="light"] .rb{color:var(--text)}
.rb.on{box-shadow:0 0 0 .2rem var(--red);background:#5b2a35}
.home .hd{padding-top:2%}
.hgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 2fr;gap:1rem;padding:0 5%}
.rt{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr auto;gap:1rem;min-height:0}
.tile{background:var(--panel);border-radius:1.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;min-height:0;padding:.6rem}
.tile svg.big{width:4.6rem;height:4.6rem}
.tile b{font-family:var(--font-display);font-size:1.3rem;font-weight:700;text-align:center}
.tile small{color:var(--muted);font-size:.8rem}
.tile.big{grid-row:span 1}
.tile.c3{grid-column:span 3}
.sb{grid-column:span 2;background:var(--btn);border-radius:.9rem;display:flex;align-items:center;justify-content:center;gap:.7rem;padding:1.1rem .6rem;font-size:1rem;font-weight:700;color:#fff}
[data-theme="light"] .sb{color:var(--text)}
.ft{display:flex;justify-content:space-between;align-items:flex-end;padding:1.4rem 2% 0;flex:none}
.ft div div{font-size:.95rem;line-height:1.6}
.clk{text-align:right}
#clock{font-family:var(--font-display);font-size:1.9rem;font-weight:700;line-height:1.1!important}
#date{text-transform:capitalize;font-size:1rem}

/* ---------- écrans liste ---------- */
.hd2{display:flex;align-items:center;gap:1rem;padding:1.6% 0 1.2%;flex:none;border-bottom:.15rem solid rgba(255,255,255,.22);margin-bottom:.7rem}
[data-theme="light"] .hd2{border-color:var(--line)}
.hd2 h1{margin:0;flex:1;font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--orange);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.types{display:flex;gap:.8rem}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:24% 25% 1fr;gap:.7rem}
.cols.two{grid-template-columns:26% 1fr}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.sbox{display:flex;align-items:center;gap:.6rem;background:var(--btn);border-radius:2rem;padding:0 1.1rem;height:2.9rem;flex:none;margin-bottom:.6rem}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;font-size:1rem;color:var(--text)}
.sbox input::placeholder{color:var(--muted)}
.sbox:focus-within{box-shadow:0 0 0 .2rem #fff}
.lst{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:.15rem}
.lst::-webkit-scrollbar{display:none}
.catrow,.crow{display:flex;align-items:center;gap:.7rem;width:100%;background:var(--row);border-radius:.45rem;padding:0 .9rem;margin-bottom:.45rem;font-size:1rem;font-weight:600}
.catrow{height:2.5rem;justify-content:space-between}
.catrow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow.on{background:var(--red);color:#fff}
.crow{height:2.85rem}
.crow.on{background:var(--row2)}
.crow .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clogo{width:2rem;height:2rem;border-radius:.4rem;flex:none;background:#1c2350;display:grid;place-items:center;overflow:hidden;position:relative;font-family:var(--font-display);font-weight:800;font-size:.9rem;color:#9fb4ff}
.clogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.crow .ic{color:var(--muted)}
.crow .fv{color:#ff6b81}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.95rem}

.c3col{display:flex;flex-direction:column;min-height:0;min-width:0}
.pv{position:relative;width:100%;aspect-ratio:16/9;max-height:58%;background:#000;border-radius:.3rem;overflow:hidden;flex:none;display:grid;place-items:center}
.pv video{position:absolute;inset:0;width:100%;height:100%;background:#000;pointer-events:none}
.nosig{display:flex;flex-direction:column;align-items:center;gap:.5rem;color:#fff;text-align:center}
.nosig img{width:3.4rem;height:3.4rem;border-radius:.9rem}
.nosig b{font-family:var(--font-display);font-size:1.2rem}
.nosig span{color:#9fb0e6;font-size:.85rem}
.info{display:flex;align-items:center;gap:.9rem;padding:.5rem .2rem;min-height:3.4rem}
.info .clogo{width:2.8rem;height:2.8rem;border-radius:.5rem}
.info h2{margin:0;font-family:var(--font-display);font-size:1.4rem;color:var(--orange);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btnrow{display:flex;gap:.7rem;margin-top:auto;padding-top:.5rem;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.5rem 1rem;border-radius:2rem;border:.14rem solid #fff;font-size:.85rem;font-weight:700;white-space:nowrap}
[data-theme="light"] .pill{border-color:var(--text)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.6rem,1fr));gap:.9rem;align-content:start}
.poster{position:relative;aspect-ratio:2/3;border-radius:.7rem;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:.6rem;text-align:left;background:#1c2350}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster::after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(to top,rgba(4,8,40,.9),rgba(4,8,40,0) 62%)}
.poster b{pointer-events:none;position:relative;z-index:1;font-family:var(--font-display);font-size:.85rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.poster .pfav{position:absolute;top:.25rem;right:.25rem;z-index:2;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.35)}
.poster .pfav.on{color:#ff6b81}
.poster .pfav.on svg{fill:currentColor}

/* ---------- pages simples ---------- */
.page{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;width:100%;max-width:46rem;margin:0 auto;padding:.4rem .3rem 1rem}
.page::-webkit-scrollbar{display:none}
.orow{display:flex;align-items:center;gap:1rem;width:100%;background:var(--row);border-radius:.6rem;padding:.9rem 1.1rem;margin-bottom:.55rem;font-size:1.02rem}
.orow .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.orow .meta span{color:var(--muted);font-size:.82rem;font-weight:600}
.orow.on{background:var(--red)}
.orow.on .meta span{color:#ffd9dc}
.chk{width:1.5rem;height:1.5rem;border-radius:.4rem;border:.15rem solid var(--muted);display:grid;place-items:center;flex:none;color:#fff}
.orow.on .chk{background:#fff;border-color:#fff;color:var(--red)}
.sw{width:3rem;height:1.7rem;border-radius:1rem;background:var(--btn);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.3rem;height:1.3rem;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(1.3rem)}
.tabs{display:flex;gap:.5rem;margin:.2rem 0 1rem}
.tabs button{flex:1;padding:.7rem .4rem;border-radius:.6rem;background:var(--btn);font-weight:700;text-align:center;font-size:.95rem}
.tabs button.on{background:var(--accent);color:#fff}
.fld{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.8rem}
.fld label{font-size:.85rem;color:var(--muted)}
.fld input{background:var(--btn);border:0;border-radius:.6rem;padding:.8rem 1rem;outline:0;width:100%;font-size:1rem;color:var(--text)}
.fld input:focus{box-shadow:0 0 0 .2rem #fff}
.act{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;background:var(--accent);color:#fff;border-radius:.7rem;padding:.9rem;font-size:1.05rem;font-weight:700;margin-top:.4rem}
.act.ghost{background:var(--btn);color:#fff}
[data-theme="light"] .act.ghost{color:var(--text)}
.sgrid{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.8rem;align-content:start;padding:.3rem .3rem 1rem}
.sgrid::-webkit-scrollbar{display:none}
.sg{background:var(--panel);border-radius:.9rem;padding:1rem;display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center;min-height:6.6rem;justify-content:center;font-size:.95rem;font-weight:700}
.sg .ic{color:#6fa0ff}
.sg small{color:var(--muted);font-size:.78rem;font-weight:600}
.big-input{font-size:1.2rem}

/* ---------- lecteur web (secours) ---------- */
#player{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;color:#fff}
.p-top{display:flex;align-items:center;gap:.8rem;padding:.6rem .9rem;background:linear-gradient(#010624,#01062400)}
.p-top b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-stage{flex:1;position:relative;min-height:0}
.p-stage video{width:100%;height:100%;background:#000}
.p-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;padding:1rem;background:radial-gradient(circle at 50% 40%,#0a2fb0 0,#030a2e 70%)}
.p-msg img{width:4rem;height:4rem;border-radius:1rem}
.p-msg p{margin:0;max-width:34ch;color:#cfdcff;font-size:.95rem}
.eq{display:flex;gap:.3rem;align-items:flex-end;height:2rem}
.eq i{width:.4rem;background:#fff;border-radius:.2rem;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:.5rem}50%{height:2rem}}

/* ---------- modale, toast, chargement ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(2,5,25,.75);display:grid;place-items:center;padding:1rem}
.sheet{width:100%;max-width:26rem;background:var(--panel);border-radius:1rem;padding:1.4rem;box-shadow:0 1rem 3rem rgba(0,0,0,.5)}
.sheet h3{margin:0 0 .3rem;font-family:var(--font-display);font-size:1.25rem;color:var(--orange)}
.sheet p{margin:0 0 .9rem;color:var(--muted);font-size:.9rem}
.sheet .err{color:#ff8593;font-size:.9rem;min-height:1.2rem;margin:-.2rem 0 .5rem}
.sheet .acts{display:flex;gap:.7rem}
.sheet .acts button{flex:1;padding:.8rem;border-radius:.6rem;background:var(--btn);text-align:center;font-weight:700;color:#fff}
.sheet .acts button.go{background:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#fff;color:#0e1120;padding:.7rem 1.2rem;border-radius:.8rem;font-weight:700;max-width:80%;text-align:center;font-size:.95rem}
.busy{position:fixed;inset:0;z-index:55;background:rgba(2,5,25,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:#fff;font-weight:700}
.spin{width:3rem;height:3rem;border-radius:50%;border:.28rem solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- lancement ---------- */
.splash{position:fixed;inset:0;z-index:100;background:#030a2e;color:#fff;overflow:hidden;display:flex;align-items:flex-end}
.sp-bg{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 7s ease-out forwards}
.splash.nophoto .sp-bg{background:radial-gradient(circle at 30% 40%,#0a4bff 0,#0324c2 42%,#030a2e 88%);animation:none}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.sp-shade{position:absolute;inset:0;background:linear-gradient(to right,rgba(1,10,58,.92) 0,rgba(1,10,58,.55) 38%,rgba(1,10,58,0) 70%),linear-gradient(to top,rgba(1,10,58,.85),rgba(1,10,58,0) 45%)}
.sp-content{position:relative;padding:0 6% 7%;display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;animation:rise .9s .25s both cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(1.5rem)}to{opacity:1;transform:none}}
.sp-logo{width:5rem;height:5rem;border-radius:1.3rem;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.4);margin-bottom:.7rem}
.sp-title{margin:0;font-family:var(--font-display);font-style:italic;font-weight:800;font-size:4.6rem;line-height:1;letter-spacing:-.02em}
.sp-by{margin:.3rem 0 1rem;font-family:var(--font-display);font-weight:600;font-size:1.7rem;color:#d5e2ff}
.sp-bar{width:14rem;height:.28rem;border-radius:.2rem;background:rgba(255,255,255,.22);overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:#fff;animation:bar 4s linear forwards}
@keyframes bar{to{width:100%}}
@media(prefers-reduced-motion:reduce){.sp-bg,.sp-content,.eq i,.sp-bar i{animation-duration:.01s;animation-delay:0s}}

.rotate{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);color:#fff;align-items:center;justify-content:center;text-align:center;font-size:1.1rem}
.rotate div{font-size:3.5rem}
.rotate p{font-size:1rem;margin:.5rem 1rem}
@media (orientation:portrait){.rotate{display:flex}}
</style>
</head>
<body>
<div id="app"></div>
<div id="player" hidden></div>
<div id="layer"></div>
<div id="toast" hidden></div>
<div class="rotate"><section><div>&#8635;</div><p>Tournez votre appareil en mode paysage</p></section></div>

<script>
const LOGO = "data:image/png;base64,%%LOGO%%";
const TEAM_TITLE = "JBM tv";
const TEAM_BY = "by Céleste Patri-land";
const NATIVE = !!(window.Capacitor && typeof Capacitor.isNativePlatform === 'function' && Capacitor.isNativePlatform());
const JP = NATIVE && window.Capacitor.Plugins ? window.Capacitor.Plugins.JbmPlayer : null;

/* ---------- icônes ---------- */
const ICONS = {
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  user:'<circle cx="10" cy="8" r="4"/><path d="M3 20c0-4 3-6 7-6M15 19l1-3 5-5 2 2-5 5z"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  power:'<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/>',
  back:'<path d="M19 12H5M11 5l-7 7 7 7"/>',
  heart:'<path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
  list:'<path d="M9 6h12M9 12h12M9 18h12M3 6l2 1.5L3 9zM3 15h3M3 19h3"/>',
  replay:'<path d="M4 12a8 8 0 1 0 3-6.2L4 8M4 3v5h5"/><path d="M10 9l5 3-5 3z"/>',
  favs:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18M6 7l3 4M11 7l3 4M16 7l3 4"/>',
  full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  eyeoff:'<path d="M3 3l18 18M10.6 6.2A9.6 9.6 0 0 1 12 6c5 0 9 4 10 6a14 14 0 0 1-3 3.6M6.4 7.6A14 14 0 0 0 2 12c1 2 5 6 10 6a9.6 9.6 0 0 0 3.4-.6"/>',
  moon:'<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>',
  hour:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5h4"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  agent:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/>',
  cache:'<path d="M4 6h16v12H4z"/><path d="M9 10l6 4M15 10l-6 4"/>',
  auto:'<path d="M4 12a8 8 0 0 1 14-5l2-2v6h-6l2.3-2.3A5 5 0 0 0 7 12M20 12a8 8 0 0 1-14 5l-2 2v-6h6l-2.3 2.3A5 5 0 0 0 17 12"/>',
  live:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
  film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  series:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  play:'<path d="M8 5v14l11-7z" fill="currentColor"/>'
};
const ic = (n, s = 1.4) => `<svg class="ic" style="width:${s}rem;height:${s}rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
