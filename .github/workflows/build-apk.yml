name: Construire l'APK JBM tv

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          npm install
          pip install pillow

      - name: Préparer l'application web
        run: node prepare-www.js

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icônes, bannière TV, manifeste et lecteur natif
        run: python patch_android.py

      - name: Synchroniser
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: JBM-tv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
